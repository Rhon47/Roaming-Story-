<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Roaming Story</title>
    
    <!-- PWA Primary Configs -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0C0B0A" />
    
    <!-- iOS / Safary Apple Devices Meta Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roaming Story" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Microsoft / Android standalone capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#0C0B0A" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
  </head>
  <body class="bg-[#0C0B0A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Progressive Registry -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('Roaming Story Service Worker Registered with Scope: ', reg.scope);
            })
            .catch(err => {
              console.error('Roaming Story Service Worker Registration Failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
